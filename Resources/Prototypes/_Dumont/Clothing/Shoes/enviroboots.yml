#Base

- type: entity
  abstract: true
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesEnvirobootsBase
  components:
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.95
  - type: TemperatureProtection
    heatingCoefficient: 0.5
    coolingCoefficient: 0.2
  - type: Clothing
    equipDelay: 0.4
    unequipDelay: 0.6 # Slightly higher delay to protect against accidental unequips
  - type: IgniteFromGasImmunity
    parts:
    - LeftFoot
    - RightFoot
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
    - PlasmamanSafe
  - type: StainBlocker
    slots: [FEET]
  - type: GuideHelp
    guides: [ Plasmaman ]

- type: entity
  parent: ClothingShoesEnvirobootsBase
  id: ClothingShoesEnviroboots
  name: plasma enviroboots
  description: Covers up those scandalous boney feet.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Service/plain.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Service/plain.rsi

#Cargo

- type: entity
  parent: [ClothingShoesEnvirobootsBase, BaseSalvageContraband]
  id: ClothingShoesEnvirobootsMaxim
  name: maxim enviroboots
  description: The journey into the unknown.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Cargo/maxim.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Cargo/maxim.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.6
        Heat: 0.3
        Radiation: 0.01
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001

- type: entity
  parent: [ClothingShoesEnvirobootsBase, BaseSalvageContraband, ClothingShoesBootsMagBase]
  id: ClothingShoesEnvirobootsSalvage
  name: salvage enviroboots
  description: Modified enviroboots for hazardous environments. They feature magnetic soles that ensure the user remains safely attached to the ground.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Cargo/salvage.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Cargo/salvage.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.8
        Heat: 0.75
        Radiation: 0.1
        Caustic: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ItemTogglePrefix
    prefixOn: on
  - type: ToggleClothingPrefix
    prefixOn: on

- type: entity
  parent: [ClothingShoesEnvirobootsBase, BaseCargoContraband]
  id: ClothingShoesEnvirobootsExplorer
  name: explorer enviroboots
  description: An armoured enviroboot for exploring harsh environments.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Cargo/shaft_miner.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Shoes/Enviroboots/Cargo/shaft_miner.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.25
      OrganDamage: 0.25
      BoneDamage: 0.25
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.65
        Heat: 0.6
        Caustic: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: FireProtection
    reduction: 0.4
  - type: PressureArmorChange

