#Base

- type: entity
  abstract: true
  parent: ClothingHandsBase
  id: ClothingHandsGlovesEnviroglovesBase
  components:
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.95
  - type: TemperatureProtection
    heatingCoefficient: 0.5
    coolingCoefficient: 0.2
  - type: Clothing
    unequipDelay: 0.6
    clothingVisuals:
      gloves:
      - state: equipped-HAND
  - type: Fiber
    fiberMaterial: fibers-rubber
  - type: FingerprintMask
  - type: IgniteFromGasImmunity
    parts:
    - LeftHand
    - RightHand
  - type: GuideHelp
    guides: [ Plasmaman ]
  - type: StainBlocker
    slots: [GLOVES]
  - type: Tag
    tags:
    - WhitelistChameleon
    - PlasmamanSafe

- type: entity
  parent: ClothingHandsGlovesEnviroglovesBase
  id: ClothingHandsGlovesEnvirogloves
  name: plasma envirogloves
  description: Covers up those scandalous boney hands.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Hands/Envirogloves/Service/plain.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Hands/Envirogloves/Service/plain.rsi
  - type: Fiber
    fiberColor: fibers-black

#Cargo

- type: entity
  parent: ClothingHandsGlovesEnviroglovesBase
  id: ClothingHandsGlovesEnviroglovesMaxim
  name: maxim envirogloves
  description: Charred bones into deadly weapons.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Hands/Envirogloves/Cargo/maxim.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Hands/Envirogloves/Cargo/maxim.rsi
  - type: Fiber
    fiberMaterial: fibers-metal
    fiberColor: fibers-red
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.6
        Heat: 0.3
        Radiation: 0.01
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001

- type: entity
  parent: ClothingHandsGlovesEnviroglovesBase
  id: ClothingHandsGlovesEnviroglovesSalvage
  name: salvage envirogloves
  description: Modified envirogloves for work in hazardous environments.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Hands/Envirogloves/Cargo/salvage.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Hands/Envirogloves/Cargo/salvage.rsi
  - type: Fiber
    fiberMaterial: fibers-metal
    fiberColor: fibers-brown
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.8
        Heat: 0.75
        Radiation: 0.1
        Caustic: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001

- type: entity
  parent: [ClothingHandsGlovesEnviroglovesBase, BaseCargoContraband]
  id: ClothingHandsGlovesEnviroglovesExplorer
  name: explorer envirogloves
  description: An armoured enviroglove for exploring harsh environments.
  components:
  - type: Sprite
    sprite: _Dumont/Clothing/Hands/Envirogloves/Cargo/shaft_miner.rsi
  - type: Clothing
    sprite: _Dumont/Clothing/Hands/Envirogloves/Cargo/shaft_miner.rsi
  - type: Fiber
    fiberMaterial: fibers-metal
    fiberColor: fibers-purple
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.6
        Heat: 0.3
        Radiation: 0.01
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: FireProtection
    reduction: 0.4
  - type: PressureArmorChange

