#Base

- type: entity
  abstract: true
  parent: ClothingHandsBase
  id: ClothingHandsGlovesEnviroglovesBase
  components:
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.95
  - type: TemperatureProtection
    heatingCoefficient: 0.5
    coolingCoefficient: 0.2
  - type: Clothing
    unequipDelay: 0.6
    clothingVisuals:
      gloves:
      - state: equipped-HAND
  - type: Fiber
    fiberMaterial: fibers-rubber
  - type: FingerprintMask
  - type: IgniteFromGasImmunity
    parts:
    - LeftHand
    - RightHand
  - type: GuideHelp
    guides: [ Plasmaman ]
  - type: StainBlocker
    slots: [GLOVES]
  - type: Tag
    tags:
    - WhitelistChameleon
    - PlasmamanSafe

- type: entity
  parent: ClothingHandsGlovesEnviroglovesBase
